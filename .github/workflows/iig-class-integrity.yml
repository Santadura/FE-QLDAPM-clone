name: IIG Class Management frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/class-student-integrity-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: FE unit tests
        run: npm test
      - name: FE lint
        run: npm run lint
      - name: Production build
        run: npm run build

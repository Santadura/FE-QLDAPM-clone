name: IIG FE + full-stack Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit-build:
    name: FE unit, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  full-stack-e2e:
    name: Real PostgreSQL + Spring Boot + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching BE branch (fallback main)
        uses: actions/checkout@v4
        with:
          repository: Santadura/BE-QLDAPM-clone
          path: backend
          ref: main
      - name: Use matching BE PR branch when available
        shell: bash
        env:
          SIBLING_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git -C backend ls-remote --exit-code --heads origin "$SIBLING_REF" >/dev/null 2>&1; then
            git -C backend fetch --depth=1 origin "$SIBLING_REF"
            git -C backend checkout --detach FETCH_HEAD
            echo "Testing backend branch $SIBLING_REF"
          else
            echo "Testing backend main (no matching branch)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Start disposable PostgreSQL, migrations, seed and Spring Boot
        working-directory: backend
        run: docker compose up --build -d
      - name: Wait for real backend readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            if curl --fail --silent --show-error -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"123456"}' | grep -q '"token"'; then
              echo "Backend ready"
              exit 0
            fi
            sleep 3
          done
          docker compose -f backend/docker-compose.yml ps -a
          exit 1
      - name: Install FE and Playwright dependencies
        run: |
          npm ci
          npm install --prefix e2e --no-audit --no-fund
          ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Vite on port 5173
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/iig-vite.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "Vite ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/iig-vite.log
          exit 1
      - name: Run full-stack Playwright regression tests
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8080/api
          E2E_SEED_PASSWORD: '123456'
        run: ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs
      - name: Save backend and frontend logs
        if: always()
        shell: bash
        run: |
          mkdir -p e2e/artifacts
          docker compose -f backend/docker-compose.yml ps -a > e2e/artifacts/docker-status.txt 2>&1 || true
          docker compose -f backend/docker-compose.yml logs --no-color > e2e/artifacts/docker.log 2>&1 || true
          cp /tmp/iig-vite.log e2e/artifacts/vite.log 2>/dev/null || true
      - name: Upload screenshots, browser trace, HTML report and service logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iig-fe-playwright-results
          path: e2e/artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable containers
        if: always()
        working-directory: backend
        run: docker compose down -v --remove-orphans
